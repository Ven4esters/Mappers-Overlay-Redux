# Мутационное тестирование (пункт 18 плана): недельная проверка в CI, не гейт на PR.
# Мутируем формулы сдвига — там эталонные тесты ловят числа, а правила проверяют
# мутанты: подмена знака или потеря `/√2` дают правдоподобный, но неверный шаг.
# Запуск: python -m mutmut run  (из .venv, чтобы `python` был тот же, что у тестов).
[mutmut]
paths_to_mutate=map_overlay/domain/movement.py
runner=python -m pytest tests/test_movement.py tests/test_properties.py -q -x -p no:cacheprovider
