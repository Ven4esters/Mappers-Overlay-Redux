[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mappers-overlay-redux"
version = "1.25.0"
description = "Mapper's Overlay Redux — оверлей для мапперов LSP (FiveM): калибровка полей панели, запись координат и сдвиг по 8 направлениям."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.8,<6.12",
    "pyperclip>=1.9,<2",
]

[project.urls]
Homepage = "https://github.com/Ven4esters/Mappers-Overlay-Redux"
Repository = "https://github.com/Ven4esters/Mappers-Overlay-Redux"
Issues = "https://github.com/Ven4esters/Mappers-Overlay-Redux/issues"
Changelog = "https://github.com/Ven4esters/Mappers-Overlay-Redux/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Полный набор разработчика — объединение узких наборов ниже. Узкие наборы нужны CI:
# job ставит только те инструменты, которые вызывает, и не тянет PyInstaller в линтер
# (пункт 19 плана). Совпадение пинов проверяет tests/test_metadata.py.
dev = [
    "mypy==1.11.2",
    "ruff==0.7.4",
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "hypothesis==6.170.17",
    "pip-audit==2.7.3",
    "bandit==1.7.10",
    "build==1.2.2",
    "detect-secrets==1.5.0",
    "pre-commit==4.0.1",
    "pyinstaller==6.10.0",
]
# Проверки кода: стиль, формат, типы, хуки, секреты.
lint = [
    "mypy==1.11.2",
    "ruff==0.7.4",
    "pre-commit==4.0.1",
    "detect-secrets==1.5.0",
]
# Тесты: pytest с покрытием и property-based проверки инвариантов формул.
test = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "hypothesis==6.170.17",
]
# Безопасность: статический анализ, уязвимости, лицензии, секреты.
security = [
    "pip-audit==2.7.3",
    "bandit==1.7.10",
    "detect-secrets==1.5.0",
]
# Сборка: пакет, SBOM, exe.
build = [
    "build==1.2.2",
    "pyinstaller==6.10.0",
]

[tool.setuptools]
packages = ["map_overlay", "map_overlay.domain", "map_overlay.application", "map_overlay.infrastructure", "map_overlay.ui", "map_overlay.ui.tabs"]

[tool.setuptools.package-data]
# Данные приложения: словарь лемм для поиска и иконка для exe.
"map_overlay" = ["data/*.json", "data/*.ico"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["map_overlay", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "RET", "ARG", "PTH", "D1",
    # Пороги из инженерного стандарта: сложность, ветвления, длина функции, число аргументов.
    "C90", "PLR0912", "PLR0913", "PLR0915",
]
# D105/D107: поведение __init__ и магических методов описано в docstring класса.
ignore = ["RUF001", "RUF002", "RUF003", "D105", "D107"]

[tool.ruff.lint.mccabe]
# Стандарт: цикломатическая сложность ≤ 10–15. Держим 12 — середину диапазона.
max-complexity = 12

[tool.ruff.lint.pylint]
# Стандарт: параметров ≤ 4–5. Порог 7 и исключение для конструкторов с внедрением
# зависимостей записаны в docs/quality/exceptions.md — правило видно и проверяется.
max-args = 7
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1", "ARG", "PLR2004"]
"tools/*" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
# Приложение настольное и работает только в Windows: разбираем именно эту ветку кода.
platform = "win32"
strict = true
# Qt-декораторы (@Slot, @Signal) в typeshed нетипизированы; это единственное исключение.
disallow_untyped_decorators = false
warn_unreachable = true
no_implicit_reexport = true
files = ["map_overlay", "tools"]
exclude = ["tests"]
# tools/ — пространство имён без __init__.py: без этого флага mypy видит tools/make_*.py
# и как `make_x`, и как `tools.make_x` и падает на «found twice under different names».
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pyperclip.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Корень проекта в sys.path: тесты импортируют tools.* (проверки документации, лицензий,
# SBOM). Без этого `pytest` и `python -m pytest` ведут себя по-разному, и CI падал на сборе.
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
