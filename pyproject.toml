[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsp-mapper-overlay"
version = "2.1.0"
description = "Внутриигровой оверлей для мапперов Los Santos Project: расчёт координат и углов пропов"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "LSP Mapper Overlay" }]
dependencies = [
    "PySide6-Essentials>=6.7",
    "pyperclip>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
lsp-overlay = "lsp_overlay.app:main"

[tool.setuptools.packages.find]
include = ["lsp_overlay*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["lsp_overlay", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "RET", "ARG", "PL"]
ignore = [
    "PLR0913",  # конструкторы виджетов Qt принимают много аргументов
    "PLR2004",  # числовые константы в проверках тестов читаемы
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "SLF001", "PLC0415"]
"tools/*" = ["ARG001"]
# заглушка ввода повторяет сигнатуры порта, но аргументы ей не нужны
"lsp_overlay/infrastructure/win32_input.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["tests/", "tools/"]

[tool.coverage.run]
branch = true
source = ["lsp_overlay"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
