name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Форматирование
        run: ruff format --check .

      - name: Линтер
        run: ruff check .

      - name: Типы
        run: mypy lsp_overlay

      - name: Тесты и покрытие
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=lsp_overlay --cov-report=term-missing --cov-fail-under=80

      - name: Сборка артефакта
        run: python -c "import compileall, sys; sys.exit(0 if compileall.compile_dir('lsp_overlay', quiet=1) else 1)"
