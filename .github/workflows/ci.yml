name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Системные библиотеки для Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Форматирование
        run: ruff format --check .
      - name: Линтер
        run: ruff check .
      - name: Типы
        run: mypy
      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=map_overlay --cov-report=term-missing --cov-fail-under=80
      - name: Статический анализ безопасности
        run: bandit -q -c pyproject.toml -r map_overlay tools
      - name: Уязвимости зависимостей
        run: pip-audit
      - name: Лицензии зависимостей
        run: python -m tools.check_licenses
      - name: Секреты в репозитории
        run: git ls-files -z | xargs -0 detect-secrets-hook
      - name: Сборка пакета
        run: python -m build --wheel --outdir build/wheel
