name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Новый прогон на той же ветке отменяет предыдущий: ждать устаревший результат незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Гейты из инженерного стандарта разложены по отдельным job'ам: каждый — самостоятельная
# проверка со своим именем, её видно в PR и можно сделать обязательной в защите ветки.
# Пять проверок: стиль, тесты, безопасность, документация, сборка.

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Стиль и типы
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pre-commit (те же хуки, что у разработчика)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Форматирование
        run: ruff format --check .
      - name: Линтер
        run: ruff check .
      - name: Типы
        run: mypy

  tests:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Системные библиотеки для Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0 libxcb-cursor0
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Проверка Qt (ошибка импорта видна аннотацией)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import traceback
          try:
              from PySide6.QtWidgets import QApplication
          except Exception as exc:  # noqa: BLE001 - нужен любой сбой загрузки Qt
              print(f"::error title=Qt не загружается::{type(exc).__name__}: {exc}")
              traceback.print_exc()
              raise SystemExit(1)
          print("Qt загружен")
          PY
      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          pytest --cov=map_overlay --cov-report=term-missing --cov-fail-under=80 \
            --tb=short -rf 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Журнал шага бывает недоступен, а аннотации видны в интерфейсе и через API.
            # Печатаем хвост журнала: он объясняет и упавшие тесты, и падение самого pytest.
            tail -8 pytest.log | while IFS= read -r line; do
              echo "::error title=Хвост журнала pytest::${line//::/--}"
            done
          fi
          exit "$status"
      - name: Журнал pytest
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore

  security:
    name: Безопасность
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Статический анализ безопасности
        run: bandit -q -c pyproject.toml -r map_overlay tools
      - name: Уязвимости зависимостей
        run: pip-audit
      - name: Лицензии зависимостей
        run: python -m tools.check_licenses
      - name: Секреты в репозитории
        run: git ls-files -z | xargs -0 detect-secrets-hook

  docs:
    name: Документация
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Пакет без зависимостей (нужна только версия)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
      - name: Документация (ссылки, якоря, разделы, версия)
        run: python -m tools.check_docs
      - name: Политика исключений (владелец и срок)
        run: python -m tools.check_exceptions
      - name: Гигиена текстовых файлов
        run: git ls-files -z | xargs -0 python -m tools.check_whitespace

  build:
    name: Сборка и SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Сборка пакета
        run: python -m build --wheel --outdir build/wheel
      - name: SBOM релиза
        run: python -m tools.make_sbom --out build/sbom.json
      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          if-no-files-found: error
