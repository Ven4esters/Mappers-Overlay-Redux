# Мутационное тестирование формул сдвига (пункт 18 плана).
#
# Не гейт: прогон долгий (минуты), поэтому он идёт по расписанию и вручную, а не на каждом
# PR — упавшая мутация не должна блокировать правку, но и забывать о ней нельзя.
# Отчёт: docs/quality/mutation.md, цель — ≤ 15 % выживших в map_overlay/domain/movement.py.

name: Мутации

on:
  schedule:
    # Каждый понедельник в 04:00 UTC: результат смотрим утром.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  mutation:
    name: Мутации (movement.py)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Версия инструмента фиксирована: отчёт должен быть сравнимым между прогонами.
          pip install "mutmut==2.5.1"
      - name: Мутации
        # mutmut 2 запускает тесты как `python -m pytest` (команда из setup.cfg). На раннере
        # `python` — это setup-python, он же ставит зависимости: PATH подменять не нужно.
        run: |
          set +e
          python -m mutmut run 2>&1 | tee mutation.log
          set -e
          # Сам `mutmut run` падает только на «тесты не проходят без мутаций» — это
          # отдельный сигнал, поэтому его падение не маскируем, но и не теряем отчёт.
          tail -40 mutation.log || true
      - name: Отчёт
        if: always()
        run: |
          {
            echo "## Мутации: map_overlay/domain/movement.py"
            echo
            echo '```'
            python -m mutmut results || echo "отчёта нет: прогон не дошёл до подсчёта"
            echo '```'
            echo
            echo "Доля выживших считается по строке; цель — не выше 15 %."
            echo "Каждый выживший разбирается вручную: эквивалент — в таблицу"
            echo "docs/quality/mutation.md, иначе — тест и правка."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Артефакты
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: |
            mutation.log
            .mutmut-cache
          if-no-files-found: ignore
          retention-days: 30
